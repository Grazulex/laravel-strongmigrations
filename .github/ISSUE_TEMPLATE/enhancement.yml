name: "Enhancement"
description: Suggest improvements to an existing feature
labels: ["type:enhancement", "status:discussion"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What does the current feature do?
      placeholder: |
        The rule currently flags all column removals...
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How could this be improved?
      placeholder: |
        Allow configuring which column removals should be flagged...
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - rules
        - analyzer
        - config
        - cli
        - docs
        - tests
        - other
